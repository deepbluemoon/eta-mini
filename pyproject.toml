[project]
name = "mlops-sample"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."] # 이 경로로 부터 테스트를 해라. 
testpaths = ["api/tests"]
addopts = "-ra"
